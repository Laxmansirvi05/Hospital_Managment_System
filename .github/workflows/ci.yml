name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.9.0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check public files
        run: pnpm check
      - name: Run unit and API tests
        run: pnpm test
